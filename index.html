<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ലോഗിൻ — അക്ഷരം</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap');
  :root{ --font-body:'Noto Sans Malayalam','Manjari','Meera',system-ui,sans-serif; --font-serif:'Instrument Serif','Manjari',serif; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ background:#000; }
  body{ background:#000; font-family:var(--font-body); color:#fff; min-height:100vh; display:flex; flex-direction:column; }
  a{ color:inherit; }
  button, input{ font-family:inherit; }
  .serif{ font-family:var(--font-serif); font-style:italic; }

  .glass{ background: rgba(255,255,255,0.01); background-blend-mode: luminosity; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border:none; box-shadow: inset 0 1px 1px rgba(255,255,255,0.1); position:relative; overflow:hidden; }
  .glass::before{ content:''; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
    background:linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none; }
  .pill{ border-radius:999px; }

  .bg-glow{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(circle at 20% 15%, rgba(126,232,250,0.10) 0%, transparent 40%), radial-gradient(circle at 85% 80%, rgba(255,157,112,0.08) 0%, transparent 40%); }

  .wrap{ position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; }
  .brand{ display:flex; align-items:center; gap:8px; margin-bottom:36px; }
  .brand-name{ font-size:1.4rem; font-weight:600; }

  .auth-card{ width:100%; max-width:380px; border-radius:28px; padding:32px 28px; }
  .tabs{ display:flex; gap:8px; margin-bottom:24px; background:rgba(255,255,255,0.05); border-radius:999px; padding:4px; }
  .tab-btn{ flex:1; padding:10px; border-radius:999px; font-size:0.85rem; font-weight:600; color:rgba(255,255,255,0.5); background:none; border:none; cursor:pointer; transition:all .2s; }
  .tab-btn.active{ background:#fff; color:#000; }

  .field{ margin-bottom:16px; }
  .field label{ font-size:0.78rem; color:rgba(255,255,255,0.5); display:block; margin-bottom:6px; }
  .field input{
    width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:12px;
    padding:12px 14px; color:#fff; font-size:0.92rem; outline:none;
  }
  .field input:focus{ border-color:rgba(255,255,255,0.35); }

  .submit-btn{
    width:100%; margin-top:8px; padding:14px; border-radius:999px; border:none; background:#fff; color:#000;
    font-size:0.95rem; font-weight:700; cursor:pointer; transition:transform .15s;
  }
  .submit-btn:active{ transform:scale(0.97); }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .status{ font-size:0.82rem; line-height:1.6; margin-top:14px; padding:10px 14px; border-radius:12px; display:none; }
  .status.show{ display:block; }
  .status.err{ background:rgba(255,100,100,0.1); color:#ffb3b3; }
  .status.ok{ background:rgba(120,255,150,0.1); color:#a8ffbc; }

  .note{ text-align:center; margin-top:22px; font-size:0.78rem; color:rgba(255,255,255,0.35); max-width:340px; line-height:1.6; }
</style>
</head>
<body>
<div id="page-content" style="visibility:hidden;">
<div class="bg-glow"></div>

<div class="wrap">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
    <span class="brand-name serif">അക്ഷരം</span>
  </div>

  <div class="auth-card glass">
    <div class="tabs">
      <button class="tab-btn active" data-mode="login">ലോഗിൻ</button>
      <button class="tab-btn" data-mode="signup">സൈൻ അപ്പ്</button>
    </div>

    <form id="auth-form">
      <div class="field">
        <label for="email">ഇമെയിൽ</label>
        <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">പാസ്‌വേഡ്</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6" autocomplete="current-password" />
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">ലോഗിൻ ചെയ്യുക</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <p class="note">ഇമെയിൽ ഉപയോഗിച്ച് ലോഗിൻ ചെയ്‌താൽ മാത്രമേ കുറിപ്പുകളും ഗെയിംസും കാണാൻ പറ്റൂ.</p>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>
<script>
  // If already logged in, skip straight to home
  firebase.auth().onAuthStateChanged(function(user){
    if (user){
      window.location.href = 'home.html';
    } else {
      document.getElementById('page-content').style.visibility = 'visible';
    }
  });

  var mode = 'login';
  var tabBtns = document.querySelectorAll('.tab-btn');
  var submitBtn = document.getElementById('submit-btn');
  tabBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      tabBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.dataset.mode;
      submitBtn.textContent = mode === 'login' ? 'ലോഗിൻ ചെയ്യുക' : 'സൈൻ അപ്പ് ചെയ്യുക';
      document.getElementById('status').classList.remove('show');
    });
  });

  function setStatus(msg, type){
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status show ' + type;
  }

  function friendlyError(code){
    var map = {
      'auth/invalid-email': 'ഇമെയിൽ ശരിയല്ല.',
      'auth/user-not-found': 'ഈ ഇമെയിൽ കൊണ്ട് അക്കൗണ്ട് ഇല്ല. സൈൻ അപ്പ് ചെയ്യൂ.',
      'auth/wrong-password': 'പാസ്‌വേഡ് തെറ്റാണ്.',
      'auth/invalid-credential': 'ഇമെയിൽ/പാസ്‌വേഡ് ശരിയല്ല.',
      'auth/email-already-in-use': 'ഈ ഇമെയിൽ നേരത്തെ രജിസ്റ്റർ ചെയ്തിട്ടുണ്ട്. ലോഗിൻ ചെയ്യൂ.',
      'auth/weak-password': 'പാസ്‌വേഡ് കുറഞ്ഞത് 6 അക്ഷരം വേണം.'
    };
    return map[code] || 'എന്തോ പിഴവ് സംഭവിച്ചു, വീണ്ടും ശ്രമിക്കൂ.';
  }

  document.getElementById('auth-form').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    submitBtn.disabled = true;
    setStatus('ദയവായി കാത്തിരിക്കൂ...', 'ok');

    var action = mode === 'login'
      ? firebase.auth().signInWithEmailAndPassword(email, password)
      : firebase.auth().createUserWithEmailAndPassword(email, password);

    action.then(function(){
      window.location.href = 'home.html';
    }).catch(function(err){
      setStatus(friendlyError(err.code), 'err');
      submitBtn.disabled = false;
    });
  });
</script>
</body>
</html>
